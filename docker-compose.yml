services:
  db:
    image: postgres:18
    # Số trong bài đo theo giờ Việt Nam; câu lọc theo ngày ra khác nếu server chạy giờ UTC.
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_PASSWORD: postgres
      PGUSER: postgres
    ports:
      - "5435:5432"
    shm_size: 256mb
    working_dir: /lab
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./bai:/lab/bai:ro
    healthcheck:
      # Lần đầu chạy, seed.sql nạp 5 triệu xe trước khi PostgreSQL nhận kết nối qua mạng.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 5s
      retries: 60
